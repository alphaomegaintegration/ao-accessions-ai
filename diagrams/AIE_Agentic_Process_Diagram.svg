<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0A1A30"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="840" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="40" y="28" width="48" height="48" rx="9" fill="#FF7A1A"/>
  <text x="64" y="60" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A1205">A&#937;</text>
  <text x="102" y="50" font-size="26" font-weight="bold" fill="#0A1A30">AIE Accessions — Agentic Process Flow</text>
  <text x="103" y="74" font-size="14.5" fill="#5A6675">One fact about a cadet in &#8594; a complete, AI-assisted documentation package out — every time.</text>
  <line x1="40" y1="92" x2="1400" y2="92" stroke="#FF7A1A" stroke-width="2.5"/>

  <!-- Section 1: the core loop -->
  <text x="40" y="124" font-size="15" font-weight="bold" fill="#0A1A30">1 · The core automation loop</text>

  <!-- Nodes -->
  <!-- 1 Trigger -->
  <g>
    <rect x="40" y="140" width="200" height="86" rx="11" fill="#FFF3E8" stroke="#FF7A1A" stroke-width="2"/>
    <text x="56" y="164" font-size="10.5" font-weight="bold" fill="#B5651D" letter-spacing="1">TRIGGER</text>
    <text x="56" y="188" font-size="15" font-weight="bold" fill="#0A1A30">Cadet Case saved</text>
    <text x="56" y="208" font-size="12" fill="#3a4658">medical factor set</text>
  </g>
  <!-- 2 Native Flow -->
  <g>
    <rect x="272" y="140" width="200" height="86" rx="11" fill="#E8F7F0" stroke="#2FAE7F" stroke-width="2"/>
    <text x="288" y="164" font-size="10.5" font-weight="bold" fill="#1E8a63" letter-spacing="1">NATIVE FLOW</text>
    <text x="288" y="188" font-size="15" font-weight="bold" fill="#0A1A30">Predict &amp; create</text>
    <text x="288" y="208" font-size="12" fill="#3a4658">first document on save</text>
  </g>
  <!-- 3 DocumentAgent -->
  <g>
    <rect x="504" y="140" width="200" height="86" rx="11" fill="#E6F4F6" stroke="#2BA8B4" stroke-width="2"/>
    <text x="520" y="164" font-size="10.5" font-weight="bold" fill="#1c7d87" letter-spacing="1">DOCUMENT AGENT</text>
    <text x="520" y="188" font-size="15" font-weight="bold" fill="#0A1A30">Complete checklist</text>
    <text x="520" y="208" font-size="12" fill="#3a4658">full policy-driven set</text>
  </g>
  <!-- 4 CopilotAgent -->
  <g>
    <rect x="736" y="140" width="200" height="86" rx="11" fill="#E6F4F6" stroke="#2BA8B4" stroke-width="2"/>
    <text x="752" y="164" font-size="10.5" font-weight="bold" fill="#1c7d87" letter-spacing="1">COPILOT AGENT</text>
    <text x="752" y="188" font-size="15" font-weight="bold" fill="#0A1A30">Summarize &amp; draft</text>
    <text x="752" y="208" font-size="12" fill="#3a4658">case note + outreach</text>
  </g>
  <!-- 5 TaskAgent -->
  <g>
    <rect x="968" y="140" width="200" height="86" rx="11" fill="#E6F4F6" stroke="#2BA8B4" stroke-width="2"/>
    <text x="984" y="164" font-size="10.5" font-weight="bold" fill="#1c7d87" letter-spacing="1">TASK AGENT</text>
    <text x="984" y="188" font-size="15" font-weight="bold" fill="#0A1A30">Queue follow-up</text>
    <text x="984" y="208" font-size="12" fill="#3a4658">high-priority task</text>
  </g>
  <!-- 6 Outcome -->
  <g>
    <rect x="1200" y="140" width="200" height="86" rx="11" fill="#EAF0F8" stroke="#16315A" stroke-width="2"/>
    <text x="1216" y="164" font-size="10.5" font-weight="bold" fill="#16315A" letter-spacing="1">OUTCOME</text>
    <text x="1216" y="186" font-size="14" font-weight="bold" fill="#0A1A30">Connected case</text>
    <text x="1216" y="206" font-size="12" fill="#3a4658">+ value meter ticks</text>
  </g>

  <!-- Arrows between nodes (y center 183) -->
  <line x1="242" y1="183" x2="270" y2="183" stroke="#0A1A30" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="474" y1="183" x2="502" y2="183" stroke="#0A1A30" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="706" y1="183" x2="734" y2="183" stroke="#0A1A30" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="938" y1="183" x2="966" y2="183" stroke="#0A1A30" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="1170" y1="183" x2="1198" y2="183" stroke="#0A1A30" stroke-width="2" marker-end="url(#arw)"/>

  <!-- captions -->
  <text x="56" y="248" font-size="11.5" fill="#5A6675">A single input enters</text>
  <text x="56" y="263" font-size="11.5" fill="#5A6675">the system of record.</text>
  <text x="288" y="248" font-size="11.5" fill="#5A6675">In-platform; no external</text>
  <text x="288" y="263" font-size="11.5" fill="#5A6675">compute (RPA 3.8).</text>
  <text x="520" y="248" font-size="11.5" fill="#5A6675">Idempotent: adds only</text>
  <text x="520" y="263" font-size="11.5" fill="#5A6675">what is missing.</text>
  <text x="752" y="248" font-size="11.5" fill="#5A6675">LLM-backed; output is a</text>
  <text x="752" y="263" font-size="11.5" fill="#5A6675">DRAFT for review.</text>
  <text x="984" y="248" font-size="11.5" fill="#5A6675">Routes the right human</text>
  <text x="984" y="263" font-size="11.5" fill="#5A6675">to the right moment.</text>
  <text x="1216" y="248" font-size="11.5" fill="#5A6675">Each doc = one cycle</text>
  <text x="1216" y="263" font-size="11.5" fill="#5A6675">eliminated.</text>

  <!-- policy table feed -->
  <g>
    <rect x="504" y="296" width="432" height="30" rx="6" fill="#F3F4F6" stroke="#CCCCCC"/>
    <text x="520" y="315" font-size="12" fill="#3a4658">Driven by the <tspan font-weight="bold" fill="#0A1A30">factor &#8594; document policy table</tspan> — a policy change is a data edit, not a code change.</text>
  </g>
  <line x1="604" y1="226" x2="604" y2="294" stroke="#2BA8B4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arw)"/>
  <line x1="836" y1="226" x2="836" y2="294" stroke="#2BA8B4" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arw)"/>

  <!-- Guardrail bar -->
  <rect x="40" y="350" width="1360" height="58" rx="10" fill="#FFF6E5" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="62" y="378" font-size="13" font-weight="bold" fill="#8a6a1f" letter-spacing="0.5">HUMAN-IN-THE-LOOP · SEAD 4</text>
  <text x="62" y="397" font-size="12.5" fill="#3a4658">AI surfaces, drafts, and automates. A human approves every applicant send and owns every eligibility, suitability, and clearance decision.</text>

  <!-- Section 2: lifecycle ribbon -->
  <text x="40" y="448" font-size="15" font-weight="bold" fill="#0A1A30">2 · Where the agents act across the accessions lifecycle</text>

  <!-- legend -->
  <rect x="640" y="436" width="13" height="13" rx="3" fill="#E8F7F0" stroke="#2FAE7F"/>
  <text x="658" y="447" font-size="11" fill="#5A6675">Native (live)</text>
  <rect x="752" y="436" width="13" height="13" rx="3" fill="#E6F4F6" stroke="#2BA8B4"/>
  <text x="770" y="447" font-size="11" fill="#5A6675">External agent (live)</text>
  <rect x="912" y="436" width="13" height="13" rx="3" fill="#FBF3E0" stroke="#C99A3B"/>
  <text x="930" y="447" font-size="11" fill="#5A6675">Licensed (Agentforce)</text>

  <!-- 10 stage chips: x = 40 + i*138, w=116, y=470 h=78 -->
  <!-- helper colors: native E8F7F0/2FAE7F ; agent E6F4F6/2BA8B4 ; licensed FBF3E0/C99A3B -->
  <!-- chip 1 -->
  <rect x="40" y="470" width="116" height="80" rx="9" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="50" y="490" font-size="10" font-weight="bold" fill="#8a6a1f">STAGE 1</text>
  <text x="50" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Lead &amp;</text>
  <text x="50" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">application</text>
  <text x="50" y="543" font-size="10" fill="#5A6675">RTM 2.1.4</text>
  <!-- chip 2 -->
  <rect x="178" y="470" width="116" height="80" rx="9" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="188" y="490" font-size="10" font-weight="bold" fill="#8a6a1f">STAGE 2</text>
  <text x="188" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Pre-screen &amp;</text>
  <text x="188" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">eligibility</text>
  <text x="188" y="543" font-size="10" fill="#5A6675">2.3.1.6 / 3.8.1.1</text>
  <!-- chip 3 (bottleneck, native) -->
  <rect x="316" y="470" width="116" height="80" rx="9" fill="#E8F7F0" stroke="#2FAE7F" stroke-width="2.6"/>
  <text x="326" y="490" font-size="10" font-weight="bold" fill="#1E8a63">STAGE 3 &#9733;</text>
  <text x="326" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Medical /</text>
  <text x="326" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">waiver</text>
  <text x="326" y="543" font-size="10" fill="#5A6675">RPA 3.8</text>
  <!-- chip 4 (agent) -->
  <rect x="454" y="470" width="116" height="80" rx="9" fill="#E6F4F6" stroke="#2BA8B4" stroke-width="1.6"/>
  <text x="464" y="490" font-size="10" font-weight="bold" fill="#1c7d87">STAGE 4</text>
  <text x="464" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Full</text>
  <text x="464" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">checklist</text>
  <text x="464" y="543" font-size="10" fill="#5A6675">1.3 / 3.3</text>
  <!-- chip 5 (agent) -->
  <rect x="592" y="470" width="116" height="80" rx="9" fill="#E6F4F6" stroke="#2BA8B4" stroke-width="1.6"/>
  <text x="602" y="490" font-size="10" font-weight="bold" fill="#1c7d87">STAGE 5</text>
  <text x="602" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Case</text>
  <text x="602" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">copilot</text>
  <text x="602" y="543" font-size="10" fill="#5A6675">RTM 3.10</text>
  <!-- chip 6 (agent) -->
  <rect x="730" y="470" width="116" height="80" rx="9" fill="#E6F4F6" stroke="#2BA8B4" stroke-width="1.6"/>
  <text x="740" y="490" font-size="10" font-weight="bold" fill="#1c7d87">STAGE 6</text>
  <text x="740" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Recruiter</text>
  <text x="740" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">worklist</text>
  <text x="740" y="543" font-size="10" fill="#5A6675">RPA 3.8</text>
  <!-- chip 7 (licensed) -->
  <rect x="868" y="470" width="116" height="80" rx="9" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="878" y="490" font-size="10" font-weight="bold" fill="#8a6a1f">STAGE 7</text>
  <text x="878" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">DoDMERB /</text>
  <text x="878" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">SF-86</text>
  <text x="878" y="543" font-size="10" fill="#5A6675">3.4.4.18-.25</text>
  <!-- chip 8 (licensed) -->
  <rect x="1006" y="470" width="116" height="80" rx="9" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="1016" y="490" font-size="10" font-weight="bold" fill="#8a6a1f">STAGE 8</text>
  <text x="1016" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Selection</text>
  <text x="1016" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">boards</text>
  <text x="1016" y="543" font-size="10" fill="#5A6675">RTM 2.1.4.7</text>
  <!-- chip 9 (licensed) -->
  <rect x="1144" y="470" width="116" height="80" rx="9" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="1154" y="490" font-size="10" font-weight="bold" fill="#8a6a1f">STAGE 9</text>
  <text x="1154" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Contracting</text>
  <text x="1154" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">&amp; onboarding</text>
  <text x="1154" y="543" font-size="10" fill="#5A6675">1.3 / 3.4.4</text>
  <!-- chip 10 (licensed) -->
  <rect x="1282" y="470" width="116" height="80" rx="9" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.6"/>
  <text x="1292" y="490" font-size="10" font-weight="bold" fill="#8a6a1f">STAGE 10</text>
  <text x="1292" y="508" font-size="11.5" font-weight="bold" fill="#0A1A30">Commission /</text>
  <text x="1292" y="523" font-size="11.5" font-weight="bold" fill="#0A1A30">accession</text>
  <text x="1292" y="543" font-size="10" fill="#5A6675">RTM 4.7</text>

  <!-- connectors between chips -->
  <g stroke="#9aa6b6" stroke-width="1.6" marker-end="url(#arw)">
    <line x1="156" y1="510" x2="176" y2="510"/>
    <line x1="294" y1="510" x2="314" y2="510"/>
    <line x1="432" y1="510" x2="452" y2="510"/>
    <line x1="570" y1="510" x2="590" y2="510"/>
    <line x1="708" y1="510" x2="728" y2="510"/>
