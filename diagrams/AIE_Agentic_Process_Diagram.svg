    <line x1="1122" y1="510" x2="1142" y2="510"/>
    <line x1="1260" y1="510" x2="1280" y2="510"/>
  </g>
  <text x="316" y="566" font-size="10.5" font-style="italic" fill="#1E8a63">&#9733; Demonstrated live — the cycle-time bottleneck</text>

  <!-- Section 3: infrastructure -->
  <text x="40" y="620" font-size="15" font-weight="bold" fill="#0A1A30">3 · Runs on</text>
  <g font-size="12" fill="#16315A">
    <rect x="40" y="634" width="186" height="34" rx="17" fill="#EAF0F8" stroke="#16315A" stroke-width="1.2"/>
    <text x="133" y="656" text-anchor="middle">Salesforce (system of record)</text>
    <rect x="238" y="634" width="196" height="34" rx="17" fill="#EAF0F8" stroke="#16315A" stroke-width="1.2"/>
    <text x="336" y="656" text-anchor="middle">Record-triggered Flow</text>
    <rect x="446" y="634" width="200" height="34" rx="17" fill="#EAF0F8" stroke="#16315A" stroke-width="1.2"/>
    <text x="546" y="656" text-anchor="middle">Python + REST (simple-salesforce)</text>
    <rect x="658" y="634" width="158" height="34" rx="17" fill="#EAF0F8" stroke="#16315A" stroke-width="1.2"/>
    <text x="737" y="656" text-anchor="middle">LLM (Copilot agent)</text>
    <rect x="828" y="634" width="186" height="34" rx="17" fill="#EAF0F8" stroke="#16315A" stroke-width="1.2"/>
    <text x="921" y="656" text-anchor="middle">Claude-for-Chrome (build/demo)</text>
    <rect x="1026" y="634" width="150" height="34" rx="17" fill="#EAF0F8" stroke="#16315A" stroke-width="1.2"/>
    <text x="1101" y="656" text-anchor="middle">SFDX deploy package</text>
    <rect x="1188" y="634" width="212" height="34" rx="17" fill="#FBF3E0" stroke="#C99A3B" stroke-width="1.2"/>
    <text x="1294" y="656" text-anchor="middle" fill="#8a6a1f">IL5 / FedRAMP — target state</text>
  </g>

  <!-- footnote -->
  <line x1="40" y1="700" x2="1400" y2="700" stroke="#E2E6EC" stroke-width="1"/>
  <text x="40" y="722" font-size="10.5" fill="#8893a3">Alpha Omega — National Security Solutions  ·  Unclassified, pre-decisional draft for technical review.  Cadet data is fictional; IL5/FedRAMP posture, model boundary, and integrations are target-state to be confirmed with the program office.</text>
